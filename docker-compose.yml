version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: clienthub-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: client_mgmt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d client_mgmt"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clienthub-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: client_mgmt
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: dev-secret-key-change-in-production-abc123xyz
      JWT_EXPIRES_IN: 24h
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 150
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
